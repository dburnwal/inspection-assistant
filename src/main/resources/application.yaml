spring:
  application:
    name: inspection-assistant
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: qwen2.5vl
        options:
          temperature: 0.2

server:
  port: 8080

inspection:
  camera:
    frame-interval-ms: 2500
  ai:
    confidence-threshold: 0.70
  image:
    max-size-mb: 5
  finding:
    confirmation-threshold: 2

logging:
  level:
    org.springframework.core.annotation.MergedAnnotation: ERROR
    io.netty.resolver.dns: OFF
    com.dburnwal.inspectionassistant: INFO
