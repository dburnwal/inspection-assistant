spring:
  application:
    name: inspection-assistant
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: qwen2.5vl
        options:
          temperature: 0.2

server:
  port: 8080

inspection:
  ai:
    provider: ollama        # ollama | mock
    confidence-threshold: 0.70

  camera:
    frame-interval-ms: 2500

  image:
    max-size-mb: 5
    max-width: 1280
    max-height: 720

  finding:
    confirmation-threshold: 2

  demo:
    enabled: true
    auto-play-interval-ms: 2500

logging:
  level:
    org.springframework.core.annotation.MergedAnnotation: ERROR
    io.netty.resolver.dns: OFF
    com.dburnwal.inspectionassistant: INFO
